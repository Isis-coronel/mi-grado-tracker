/* ============ FECHAS ============ */
function d(s){const p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2],12,0,0);}
function key(t){return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');}
function addD(t,n){const x=new Date(t);x.setDate(x.getDate()+n);return x;}
function mondayOf(t){const x=new Date(t);const dw=x.getDay();x.setDate(x.getDate()-(dw===0?6:dw-1));x.setHours(12,0,0,0);return x;}
function diffD(a,b){return Math.round((d(b)-a)/86400000);}
const TODAY=new Date();TODAY.setHours(12,0,0,0);
const TKEY=key(TODAY);
function weekOf(k){const t=d(k);for(const w of WEEKS){if(t>=d(w.s)&&t<=d(w.e))return w;}return null;}
function refWeek(){const w=weekOf(TKEY);if(w)return w.n;let last=0;WEEKS.forEach(x=>{if(d(x.e)<TODAY)last=x.n;});return last;}
const RW=refWeek();
function weekFrac(){const w=weekOf(TKEY);if(!w)return 1;
 const tot=Math.round((d(w.e)-d(w.s))/86400000)+1;
 const el=Math.round((TODAY-d(w.s))/86400000)+1;
 return Math.min(1,Math.max(0,el/tot));}
const WF=weekFrac();
function deadline(it){const w=WEEKS.find(x=>x.n===it.w);return w?w.e:null;}
function dlLbl(it){const w=WEEKS.find(x=>x.n===it.w);if(!w)return '';const t=d(w.e);return t.getDate()+' '+MES[t.getMonth()];}

/* ============ RITMO ============ */
function stat(sub){
 const prev=sub.items.filter(x=>x.w<RW).length;
 const cur=sub.items.filter(x=>x.w===RW).length;
 const exp=prev+Math.round(cur*WF);
 const done=sub.items.filter(x=>DONE.has(x.id)).length;
 const undone=sub.items.filter(x=>!DONE.has(x.id));
 const late=undone.slice(0,Math.max(0,exp-done));
 const delta=done-exp;
 let k,l;
 if(delta>0){k='ade';l='Por delante';}
 else if(delta===0){k='dia';l='Al día';}
 else if(-delta<=sub.wavg){k='det';l=(exp-done)+' por hacer';}
 else {k='mal';l=(exp-done)+' atrasadas';}
 return {k:k,l:l,done:done,tot:sub.items.length,exp:exp,late:late,pct:Math.round(100*done/sub.items.length),delta:delta};
}
function next(sub,n){const o=sub.items.filter(x=>!DONE.has(x.id));return n?o.slice(0,n):o[0];}
function planFor(k){
 if(SPECIAL[k])return {sp:SPECIAL[k]};
 if(k<START)return {pre:true};
 const dw=d(k).getDay();
 if(dw===0||dw===6)return {free:true};
 if(dw===5)return {pend:true};
 return {subs:ROT[dw]};
}

function row(it,cls){
 const on=DONE.has(it.id);const over=!on&&it.w<RW;
 return `<label class="tk${on?' on':''}${it.opt?' opt':''}${cls?' '+cls:''}">
 <input type="checkbox" data-id="${it.id}"${on?' checked':''}><span class="tk-b"></span>
 <span class="tk-c"><span class="tk-t">${esc(it.txt)}</span>
 <span class="tk-m">${TNAME[it.type]} · U${it.u} · ${it.min} min · <span class="${over?'over':''}">S${it.w} · ${dlLbl(it)}</span>${it.opt?' · opcional':''}</span></span></label>`;
}

function pill(s){const ic={ade:'&#128081;',dia:'',det:'',mal:''}[s.k];
 return `<span class="pill ${s.k}">${ic?ic+' ':''}${s.l}</span>`;}

function subBlock(code,slot){
 const sub=BY[code];const s=stat(sub);
 const nx=next(sub);
 let h=`<div class="sb ${s.k}">
  <div class="sb-h"><div><span class="sb-slot">${slot}</span><h2>${esc(sub.n)}</h2></div>${pill(s)}</div>
  <div class="prog"><span class="pbar ${s.k}" style="width:${s.pct}%"></span><i style="left:${Math.round(100*s.exp/s.tot)}%"></i></div>
  <div class="prog-m"><span>${s.done} de ${s.tot} hechas · ${s.pct}%</span><span>meta de hoy: ${s.exp}</span></div>`;
 if(!nx){h+=`<p class="allok">Asignatura terminada.</p></div>`;return h;}
 h+=`<div class="first"><span class="first-k">Abre esto primero</span><div class="first-t">${esc(nx.txt)}</div>
  <div class="first-m">${TNAME[nx.type]} · Unidad ${nx.u} · ${esc(nx.ut)}</div></div>`;
 if(s.k==='det'||s.k==='mal'){
  h+=`<div class="catch"><p class="catch-h">${s.late.length} tarea${s.late.length>1?'s':''} para ponerte al día</p>
   ${s.late.map(i=>row(i)).join('')}</div>`;
 }else{
  h+=`<div class="cont"><p class="cont-h">Y sigues por aquí mientras te dure la hora</p>
   ${next(sub,6).map(i=>row(i)).join('')}</div>`;
 }
 return h+`</div>`;
}

function strip(){
 let h=`<div class="strip"><button class="nav" data-nav="-7">&#8249;</button><div class="days">`;
 for(let i=0;i<7;i++){
  const t=addD(ANCHOR,i),k=key(t),p=planFor(k);
  const w=weekOf(k);
  const cls=[k===SEL?'sel':'',k===TKEY?'today':'',p.free||p.pre?'off':'',p.pend?'pend':''].join(' ');
  let tag='';
  if(p.sp)tag='Inglés';else if(p.pend)tag='Pendientes';else if(p.subs)tag=p.subs.map(c=>BY[c].ab.split(' ')[0]).join(' + ');else tag=p.pre?'—':'Libre';
  h+=`<button class="day ${cls}" data-day="${k}">
   <span class="day-l">${DL[t.getDay()]}</span><span class="day-n">${t.getDate()}</span>
   <span class="day-t">${esc(tag)}</span></button>`;
 }
 const wk=weekOf(key(ANCHOR))||weekOf(key(addD(ANCHOR,4)));
 h+=`</div><button class="nav" data-nav="7">&#8250;</button></div>
  <p class="strip-m">${wk?'Semana '+wk.n+' de 34 · '+wk.l+(wk.sp?' · '+wk.sp:''):'Periodo sin clases'}</p>`;
 return h;
}

function urgency(){
 const dx=diffD(TODAY,EXAM);
 const aut=ITEMS.filter(x=>x.type==='A'&&!DONE.has(x.id)).sort((a,b)=>a.w-b.w)[0];
 let an='—',ad=0;
 if(aut){const w=WEEKS.find(x=>x.n===aut.w);ad=diffD(TODAY,w.e);an=BY[aut.c].ab+' U'+aut.u;}
 const tot=ITEMS.length,dn=ITEMS.filter(x=>DONE.has(x.id)).length;
 const exp=SUBJECTS.reduce((a,s)=>a+stat(s).exp,0);
 return `<div class="urg">
  <div class="u"><b>${dx}</b><span>días para los exámenes presenciales</span></div>
  <div class="u ${ad<7?'hot':''}"><b>${ad>=0?ad:0}</b><span>días para cerrar ${esc(an)}</span></div>
  <div class="u ${dn<exp?'hot':''}"><b>${dn}/${exp}</b><span>hechas de las que tocaban</span></div>
 </div>`;
}

function viewHoy(){
 const k=SEL,t=d(k),p=planFor(k);
 let h=urgency()+strip();
 h+=`<div class="dayhead"><h1>${DAYNAME[t.getDay()]} ${t.getDate()} de ${MESL[t.getMonth()]}</h1>
  ${k===TKEY?'<span class="badge">Hoy</span>':`<button class="link" data-day="${TKEY}">Volver a hoy</button>`}</div>`;
 if(p.pre)return h+`<div class="note">El plan de dos asignaturas al día arranca el miércoles 16 de septiembre.</div>`;
 if(p.free)return h+`<div class="note">Día libre. Si te apetece adelantar, entra en Asignaturas y sigue por donde lo dejaste.</div>`;
 if(p.sp){
  const s=stat(BY[p.solo=p.sp.solo]);
  return h+`<div class="note">${p.sp.lbl}: hoy no hay rotación. Vas a por Inglés hasta donde llegues. Si Universae solo te tiene abierta la Unidad 1, haz esa entera y el resto según se publiquen.</div>`+subBlock(p.sp.solo,'Todo el día');
 }
 if(p.pend){
  const all=[];SUBJECTS.forEach(s=>{const st=stat(s);if(st.late.length)all.push([s,st]);});
  all.sort((a,b)=>(a[1].k==='mal'?0:1)-(b[1].k==='mal'?0:1)||b[1].late.length-a[1].late.length);
  h+=`<div class="note">Viernes: pendientes y apuntes. Empieza por lo rojo. Si no hay nada rojo, pasa los apuntes de la semana.</div>`;
  if(!all.length)return h+`<div class="sb dia"><p class="allok">No tienes nada atrasado. Dedica las 2 h a apuntes y a adelantar la asignatura que peor lleves.</p></div>`;
  all.forEach(([s,st])=>{h+=`<div class="sb ${st.k}"><div class="sb-h"><div><h2>${esc(s.n)}</h2></div>${pill(st)}</div>
   ${st.late.map(i=>row(i)).join('')}</div>`;});
  return h;
 }
 h+=subBlock(p.subs[0],'Primera hora · fuerte');
 h+=subBlock(p.subs[1],'Segunda hora · ligera');
 return h;
}

function viewAsig(){
 let h=`<div class="head"><h1>Asignaturas</h1><p>Marca todo lo que hagas, vídeos e infografías incluidos. Lo primero sin marcar es lo que te aparece como "abre esto primero" en tu día.</p></div>`;
 const ord=SUBJECTS.slice().sort((a,b)=>{const r={mal:0,det:1,dia:2,ade:3};return r[stat(a).k]-r[stat(b).k];});
 ord.forEach(sub=>{
  const s=stat(sub);
  h+=`<details class="sub ${s.k}"><summary>
   <span class="sub-n">${esc(sub.n)}</span>${pill(s)}
   <span class="sub-p"><span class="prog"><span class="pbar ${s.k}" style="width:${s.pct}%"></span><i style="left:${Math.round(100*s.exp/s.tot)}%"></i></span>${s.pct}%</span></summary>`;
  Object.keys(sub.u).forEach(un=>{
   const its=sub.items.filter(x=>x.u==+un);
   const dn=its.filter(x=>DONE.has(x.id)).length;
   h+=`<div class="unit"><h3>Unidad ${un} · ${esc(sub.u[un][0])} <em>${dn}/${its.length}</em></h3>
    ${its.map(i=>row(i)).join('')}</div>`;});
  h+=`</details>`;});
 return h;
}

function viewCal(){
 let h=`<div class="head"><h1>Calendario del curso</h1><p>Las semanas en rojo concentran cuatro o más autoevaluaciones.</p></div><div class="cal">`;
 WEEKS.forEach(w=>{
  const ts=ITEMS.filter(x=>x.w===w.n),ae=ts.filter(x=>x.type==='A');
  const dn=ts.filter(x=>DONE.has(x.id)).length;
  h+=`<div class="cw ${w.n===RW?'now':''} ${w.sp?'sp':''} ${ae.length>=4?'hot':''}">
   <div class="cw-n">S${w.n}</div><div class="cw-d">${w.l}</div>
   ${w.sp?`<div class="cw-sp">${w.sp}</div>`:`<div class="cw-b"><span style="width:${ts.length?100*dn/ts.length:0}%"></span></div>
   <div class="cw-m">${ts.length} tareas${ae.length?` · <b>${ae.length} autoeval.</b>`:''}</div>`}</div>`;
  const g=GAPS.find(x=>x.after===w.n);if(g)h+=`<div class="gap">${g.txt}</div>`;});
 return h+`</div>`;
}

function viewPlan(){
 const tot=ITEMS.reduce((a,x)=>a+x.min,0);
 return `<div class="head"><h1>Tu plan</h1><p>2 h al día, dos asignaturas: una fuerte y una ligera. Viernes para pendientes y apuntes.</p></div>
<div class="blk"><table class="tb">
<tr><th>Día</th><th>Primera hora · fuerte</th><th>Segunda hora · ligera</th></tr>
<tr><td>Lunes</td><td>Sistemas eléctricos, neumáticos e hidráulicos</td><td>Itinerario Personal Empleabilidad I</td></tr>
<tr><td>Martes</td><td>Sistemas secuenciales programables</td><td>Ampliación IPE</td></tr>
<tr><td>Miércoles</td><td>Sistemas de medida y regulación</td><td>Documentación técnica</td></tr>
<tr><td>Jueves</td><td>Sistemas de potencia</td><td>Informática industrial</td></tr>
<tr><td>Viernes</td><td colspan="2">Pendientes y apuntes de todas</td></tr>
</table>
<p class="blk-s">Inglés sale de la rotación: lo liquidas aparte. Si se te atasca, vuelve a meterlo los viernes.</p></div>
<div class="blk"><h2>Qué significan los colores</h2>
<ul class="leg">
<li><span class="pill ade">&#128081; Por delante</span> Vas por encima de la temporalización. Es donde quieres estar antes de abril.</li>
<li><span class="pill dia">Al día</span> Justo en la marca. La rayita vertical de la barra es esa marca.</li>
<li><span class="pill det">3 por hacer</span> Menos de una semana de retraso. Se arregla el viernes.</li>
<li><span class="pill mal">12 atrasadas</span> Más de una semana. Esta asignatura sube al principio de la lista y te salen todas las pendientes en el día.</li>
</ul></div>
<div class="blk"><h2>Los números</h2><table class="tb">
<tr><td>Material del curso</td><td><b>${(tot/60).toFixed(0)} h</b></td></tr>
<tr><td>Tareas marcables</td><td><b>${ITEMS.length}</b></td></tr>
<tr><td>Tu ritmo</td><td><b>10 h por semana</b></td></tr>
<tr><td>Hasta el examen</td><td><b>unas 320 h</b></td></tr>
</table>
<p class="blk-s">Te sobran unas 115 h. Ese colchón es lo que te permite llegar holgada a la semana 30, donde las nueve asignaturas cierran autoevaluación a la vez.</p></div>
<div class="blk"><h2>Copia de seguridad</h2>
<div class="btns"><button id="exp">Exportar</button><button id="imp">Importar</button><button id="rst" class="danger">Reiniciar</button></div>
<textarea id="io" placeholder="Al exportar aparece aquí tu copia."></textarea></div>`;
}

const VIEWS={hoy:viewHoy,asignaturas:viewAsig,calendario:viewCal,plan:viewPlan};
const TABS=[['hoy','Mi día'],['asignaturas','Asignaturas'],['calendario','Calendario'],['plan','Plan']];

function render(){
 const dn=ITEMS.filter(x=>DONE.has(x.id)).length;
 app.innerHTML=`<div class="shell">
  <header class="top"><div class="brand"><span class="mark"></span>Automatización y Robótica Industrial · Universae</div>
   <div class="gp">${dn} de ${ITEMS.length}</div></header>
  <nav class="tabs">${TABS.map(([k,l])=>`<button data-tab="${k}"${TAB===k?' class="on"':''}>${l}</button>`).join('')}</nav>
  <main>${VIEWS[TAB]()}</main></div>`;
 app.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{TAB=b.dataset.tab;render();window.scrollTo(0,0);});
 app.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{SEL=b.dataset.day;ANCHOR=mondayOf(d(SEL));render();});
 app.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{ANCHOR=addD(ANCHOR,+b.dataset.nav);render();});
 app.querySelectorAll('input[data-id]').forEach(cb=>cb.onchange=()=>{
  cb.checked?DONE.add(cb.dataset.id):DONE.delete(cb.dataset.id);save();render();});
 const e=document.getElementById('exp');
 if(e){e.onclick=()=>{document.getElementById('io').value=JSON.stringify([...DONE]);};
  document.getElementById('imp').onclick=()=>{try{DONE=new Set(JSON.parse(document.getElementById('io').value));save();render();}catch(x){document.getElementById('io').value='Copia no válida.';}};
  document.getElementById('rst').onclick=()=>{if(confirm('Se borra todo tu progreso. ¿Seguro?')){DONE=new Set();save();render();}};}
}

/* ===== v4: racha, autoevaluaciones, apuntes, historial ===== */
const K4='universae-arbi-v4';
let AEV={},NOTES=new Set(),FRZ=new Set(),STUD=new Set(),LOG=[];
const ROTSEQ=[['ELAR01','ELAR18'],['ELAR02','ELAR23'],['ELAR03','ELAR05'],['ELAR04','ELAR07'],'PEND'];
const DIF={v:'\u{1F7E2}',a:'\u{1F49B}',r:'\u{1F3EE}'};

async function load4(){let o=null;
 try{if(window.storage){const r=await window.storage.get(K4,false);if(r&&r.value)o=JSON.parse(r.value);}}catch(e){}
 if(!o){try{const v=localStorage.getItem(K4);if(v)o=JSON.parse(v);}catch(e){}}
 if(o){AEV=o.a||{};NOTES=new Set(o.n||[]);FRZ=new Set(o.f||[]);STUD=new Set(o.s||[]);LOG=o.l||[];}}
async function save4(){const a=JSON.stringify({a:AEV,n:[...NOTES],f:[...FRZ],s:[...STUD],l:LOG});
 try{if(window.storage){await window.storage.set(K4,a,false);}}catch(e){}
 try{localStorage.setItem(K4,a);}catch(e){}}
function stamp(){const t=new Date();return key(t)+' '+String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0');}
function log(s){LOG.push(stamp()+'  '+s);STUD.add(TKEY);save4();}

function isLect(k){const t=d(k);return t.getDay()>0&&t.getDay()<6&&!!weekOf(k);}
function weekDays(k){const m=mondayOf(d(k));const L=[];
 for(let i=0;i<5;i++){const x=key(addD(m,i));if(isLect(x))L.push(x);}
 const fz=L.filter(x=>FRZ.has(x)).length;
 for(let i=5;i<5+fz&&i<7;i++)L.push(key(addD(m,i)));
 return L;}
function planFor(k){
 if(SPECIAL[k])return {sp:SPECIAL[k]};
 if(k<START)return {pre:true};
 if(FRZ.has(k))return {frozen:true};
 const L=weekDays(k),i=L.indexOf(k);
 if(i<0)return {free:true};
 const eff=i-L.slice(0,i).filter(x=>FRZ.has(x)).length;
 const p=ROTSEQ[eff];
 if(!p)return {free:true};
 return p==='PEND'?{pend:true}:{subs:p};}

function streak(){let n=0,t=new Date(TODAY);
 if(!STUD.has(TKEY)&&!FRZ.has(TKEY))t=addD(t,-1);
 for(let g=0;g<400;g++){const k=key(t);
  if(k<'2026-09-15')break;
  if(!isLect(k)&&!FRZ.has(k)){t=addD(t,-1);continue;}
  if(STUD.has(k)||FRZ.has(k)){n++;t=addD(t,-1);}else break;}
 return n;}
function frzWeek(k){return weekDays(k).filter(x=>FRZ.has(x)).length;}

/* unidades completas y apuntes */
function unitDone(sub,u){return sub.items.filter(x=>x.u==u).every(x=>DONE.has(x.id));}
function unitsReady(sub){return Object.keys(sub.u).filter(u=>unitDone(sub,u)&&!NOTES.has(sub.c+'|'+u));}

/* ===== autoevaluaciones ===== */
function aevKey(it){return it.c+'|'+it.u;}
function aevBox(it){const k=aevKey(it),ar=AEV[k]||[];
 return `<div class="aev" id="aev-${k.replace('|','-')}">
  <div class="aev-r"><button class="stp" data-aev="dec" data-k="${k}">&minus;</button>
   <span class="aev-n">${ar.length} intento${ar.length===1?'':'s'}</span>
   <button class="stp" data-aev="inc" data-k="${k}">+</button>
   <input class="aev-g" data-g="${k}" placeholder="nota" inputmode="decimal">
   <span class="aev-d">${Object.keys(DIF).map(x=>`<button class="dif" data-dif="${x}" data-k="${k}">${DIF[x]}</button>`).join('')}</span></div>
  ${ar.length?`<div class="aev-l">${ar.map(a=>`${a.d} · ${a.n||'—'} · ${DIF[a.f]||''}`).join('<br>')}</div>`:''}</div>`;}

function row(it,cls){
 const on=DONE.has(it.id),over=!on&&it.w<RW;
 let h=`<label class="tk${on?' on':''}${it.opt?' opt':''}${cls?' '+cls:''}">
 <input type="checkbox" data-id="${it.id}"${on?' checked':''}><span class="tk-b"></span>
 <span class="tk-c"><span class="tk-t">${esc(it.txt)}</span>
 <span class="tk-m">${TNAME[it.type]} · U${it.u} · ${it.min} min · <span class="${over?'over':''}">S${it.w} · ${dlLbl(it)}</span>${it.opt?' · opcional':''}</span></span></label>`;
 if(it.type==='A')h+=aevBox(it);
 return h;}

/* ===== vista HOY ===== */
function viewHoy(){
 const k=SEL,t=d(k),p=planFor(k);
 let h=streakBar()+urgency()+strip();
 h+=`<div class="dayhead"><h1>${DAYNAME[t.getDay()]} ${t.getDate()} de ${MESL[t.getMonth()]}</h1>
  ${k===TKEY?'<span class="badge">Hoy</span>':`<button class="link" data-day="${TKEY}">Volver a hoy</button>`}</div>`;
 if(p.pre)return h+`<div class="note">El plan arranca el miércoles 16 de septiembre.</div>`;
 if(p.frozen)return h+`<div class="note">Día congelado. Tu racha sigue intacta y el resto de la semana se ha corrido un día.</div>`;
 if(p.free)return h+`<div class="note">Día de descanso. No rompe racha. Si quieres adelantar, entra en Asignaturas.</div>`;
 if(p.sp)return h+`<div class="note">${p.sp.lbl}: hoy vas a por Inglés hasta donde llegues.</div>`+subBlock(p.sp.solo,'Todo el día');
 if(p.pend)return h+viewViernes();
 return h+subBlock(p.subs[0],'Primera hora · fuerte')+subBlock(p.subs[1],'Segunda hora · ligera');}

function viewViernes(){
 const atras=[];SUBJECTS.forEach(s=>{const st=stat(s);if(st.late.length)atras.push([s,st]);});
 atras.sort((a,b)=>b[1].late.length-a[1].late.length);
 const ap=SUBJECTS.map(s=>[s,unitsReady(s)]).filter(x=>x[1].length).sort((a,b)=>b[1].length-a[1].length);
 let h=`<div class="note"><b>Viernes, día extra.</b> Primero lo atrasado. Después, apuntes de las unidades que ya has cerrado.</div>`;
 if(!atras.length)h+=`<div class="sb dia"><p class="allok">Nada atrasado. Todo el viernes es para apuntes.</p></div>`;
 atras.forEach(([s,st])=>{h+=`<div class="sb ${st.k}"><div class="sb-h"><div><span class="sb-slot">Ponerse al día</span><h2>${esc(s.n)}</h2></div>${pill(st)}</div>
  ${st.late.map(i=>row(i)).join('')}</div>`;});
 if(!ap.length)h+=`<div class="sb dia"><p class="allok">Aún no has cerrado ninguna unidad entera. Los apuntes aparecerán aquí en cuanto termines una (temario, recursos y autoevaluación).</p></div>`;
 ap.forEach(([s,us])=>{h+=`<div class="sb ade"><div class="sb-h"><div><span class="sb-slot">Apuntes · ${us.length} unidad${us.length>1?'es':''} lista${us.length>1?'s':''}</span><h2>${esc(s.n)}</h2></div></div>
  ${us.map(u=>`<label class="tk"><input type="checkbox" data-note="${s.c}|${u}"><span class="tk-b"></span>
   <span class="tk-c"><span class="tk-t">Apuntes · Unidad ${u} — ${esc(s.u[u][0])}</span>
   <span class="tk-m">Unidad cerrada · toca resumirla</span></span></label>`).join('')}</div>`;});
 return h;}

/* ===== racha en la cabecera ===== */
function streakBar(){
 const st=streak(),fz=frzWeek(TKEY),can=fz<2&&!FRZ.has(TKEY)&&isLect(TKEY);
 return `<div class="urg4"><div class="fire"><b>\u{1F525} ${st}</b><span>días de racha</span></div>
  <div class="frz"><span>Congeladores: ${2-fz} de 2 esta semana</span>
  ${can?`<button class="fz" id="frzbtn">Usar congelador hoy</button>`:''}</div></div>`;}

/* ===== historial ===== */
function viewLog(){
 return `<div class="head"><h1>Caja negra</h1><p>Todo lo que has hecho, con fecha y hora. Copia y pega donde quieras.</p></div>
 <div class="blk"><div class="btns"><button id="cpy">Copiar todo</button></div>
 <textarea id="logbox" class="logbox" readonly>${esc(LOG.slice().reverse().join('\n'))||'Aún no hay movimientos.'}</textarea></div>`;}

VIEWS.historial=viewLog;TABS.push(['historial','Historial']);

const baseRender=render;
render=function(){baseRender();
 app.querySelectorAll('input[data-id]').forEach(cb=>cb.onchange=()=>{
  const it=ITEMS.find(x=>x.id===cb.dataset.id);
  if(cb.checked){DONE.add(cb.dataset.id);log('\u2713 '+BY[it.c].ab+' U'+it.u+' — '+it.txt);}
  else{DONE.delete(cb.dataset.id);log('\u2717 deshecho: '+BY[it.c].ab+' U'+it.u+' — '+it.txt);}
  save();render();});
 app.querySelectorAll('input[data-note]').forEach(cb=>cb.onchange=()=>{
  const[c,u]=cb.dataset.note.split('|');
  if(cb.checked){NOTES.add(cb.dataset.note);log('\u{1F4DD} Apuntes '+BY[c].ab+' U'+u);}
  else{NOTES.delete(cb.dataset.note);log('\u2717 apuntes deshechos '+BY[c].ab+' U'+u);}
  save4();render();});
 app.querySelectorAll('[data-aev]').forEach(b=>b.onclick=()=>{
  const k=b.dataset.k,[c,u]=k.split('|');AEV[k]=AEV[k]||[];
  if(b.dataset.aev==='inc'){
   const g=app.querySelector('[data-g="'+k+'"]');
   AEV[k].push({d:stamp(),n:g?g.value.trim():'',f:b.dataset.f||''});
   log('\u{1F4CA} Autoevaluación '+BY[c].ab+' U'+u+' — intento '+AEV[k].length+(g&&g.value?' · nota '+g.value:''));
  }else if(AEV[k].length){const x=AEV[k].pop();log('\u2717 intento borrado '+BY[c].ab+' U'+u);}
  save4();render();});
 app.querySelectorAll('[data-dif]').forEach(b=>b.onclick=()=>{
  const k=b.dataset.k,[c,u]=k.split('|');AEV[k]=AEV[k]||[];
  if(!AEV[k].length){const g=app.querySelector('[data-g="'+k+'"]');AEV[k].push({d:stamp(),n:g?g.value.trim():'',f:b.dataset.dif});}
  else AEV[k][AEV[k].length-1].f=b.dataset.dif;
  log('\u{1F3AF} Dificultad '+BY[c].ab+' U'+u+' — '+DIF[b.dataset.dif]);save4();render();});
 const fb=document.getElementById('frzbtn');
 if(fb)fb.onclick=()=>{if(confirm('Usas un congelador hoy. La racha se mantiene y el resto de la semana se corre un día.')){
  FRZ.add(TKEY);log('\u{1F9CA} Congelador usado');save4();render();}};
 const cp=document.getElementById('cpy');
 if(cp)cp.onclick=()=>{const t=document.getElementById('logbox');t.select();try{document.execCommand('copy');cp.textContent='Copiado';}catch(e){}};
}

/* ===== v5: subcarpetas por categoria, estado abierto persistente, estilo brutalista ===== */
const OPEN=new Set();
const CATORD=['T','VC','VE','CI','LAB','SIM','AR','E360','IN','EJ','D','VOC','S','A'];
const CATN={T:'Temario',VC:'Vídeo clases',VE:'Vídeos explicativos',CI:'Clases interactivas',LAB:'Laboratorio',SIM:'Simuladores',AR:'Realidad aumentada',E360:'Entornos 360',IN:'Infografías',EJ:'Ejercicios',D:'Destrezas',VOC:'Vocabulario',S:'Síntesis',A:'Autoevaluación'};
function det(k,cls,head,body){return `<details class="${cls}" data-o="${k}"${OPEN.has(k)?' open':''}><summary>${head}</summary>${body}</details>`;}

viewAsig=function(){
 let h=`<div class="head"><h1>Asignaturas</h1><p>Abierto por categorías. Marca lo que hagas: el desplegable se queda donde está.</p></div>`;
 const ord=SUBJECTS.slice().sort((a,b)=>{const r={mal:0,det:1,dia:2,ade:3};return r[stat(a).k]-r[stat(b).k];});
 ord.forEach(sub=>{const s=stat(sub);
  let ub='';
  Object.keys(sub.u).forEach(un=>{
   const its=sub.items.filter(x=>x.u==un),dn=its.filter(x=>DONE.has(x.id)).length;
   let cb='';
   CATORD.forEach(ty=>{const ci=its.filter(x=>x.type===ty);if(!ci.length)return;
    const cd=ci.filter(x=>DONE.has(x.id)).length;
    cb+=det('c:'+sub.c+'|'+un+'|'+ty,'cat'+(cd===ci.length?' full':''),
     `<span class="cat-n">${CATN[ty]}</span><span class="cat-c">${cd}/${ci.length}</span>`,
     `<div class="cat-b">${ci.map(i=>row(i)).join('')}</div>`);});
   ub+=det('u:'+sub.c+'|'+un,'unit2'+(dn===its.length?' full':''),
    `<span class="u-n">Unidad ${un} · ${esc(sub.u[un][0])}</span><span class="u-c">${dn}/${its.length}</span>`,cb);});
  h+=det('s:'+sub.c,'sub '+s.k,
   `<span class="sub-n">${esc(sub.n)}</span>${pill(s)}<span class="sub-p"><span class="prog"><span class="pbar ${s.k}" style="width:${s.pct}%"></span><i style="left:${Math.round(100*s.exp/s.tot)}%"></i></span>${s.pct}%</span>`,
   `<div class="ubox">${ub}</div>`);});
 return h;};
VIEWS.asignaturas=viewAsig;

/* ===== v6: popup de autoevaluacion ===== */
let MODAL=null;
function drawModal(){
 let el=document.getElementById('mdl');
 if(!el){el=document.createElement('div');el.id='mdl';document.body.appendChild(el);}
 if(!MODAL){el.style.display='none';el.innerHTML='';return;}
 const ar=AEV[MODAL.k]||[];
 el.style.display='flex';
 el.innerHTML=`<div class="mb"><div class="mb-h">Autoevaluación</div>
  <div class="mb-t">${esc(BY[MODAL.c].ab)} · Unidad ${MODAL.u}</div>

/* ===== v7: fecha real, racha reconstruida desde el historial, recarga al cambiar de dia ===== */
function realKey(){const t=new Date();t.setHours(12,0,0,0);return key(t);}
function log(s){LOG.push(stamp()+'  '+s);STUD.add(realKey());save4();}
function rebuildStud(){let n=0;LOG.forEach(l=>{const m=l.match(/^(\d{4}-\d{2}-\d{2}) /);
 if(m&&(l.indexOf('\u2713')>0||l.indexOf('\u{1F4CA}')>0||l.indexOf('\u{1F4DD}')>0||l.indexOf('\u{1F9CA}')>0)){if(!STUD.has(m[1]))n++;STUD.add(m[1]);}});return n;}
const l40=load4;
load4=async function(){await l40();const n=rebuildStud();
 if(n){LOG.push(stamp()+'  \u{1F527} Racha reconstruida desde el historial: '+n+' día(s) recuperados');}
 await save4();};

/* ===== v9: tolerancia de racha + clases en directo ===== */
function streakInfo(){
 let n=0,gap=0,lastGap=0,t=new Date(TODAY),started=false;
 if(!STUD.has(TKEY)&&!FRZ.has(TKEY))t=addD(t,-1);
 for(let g=0;g<400;g++){const k=key(t);
  if(k<'2026-09-15')break;
  if(!isLect(k)&&!FRZ.has(k)){t=addD(t,-1);continue;}
  if(STUD.has(k)||FRZ.has(k)){n++;if(!started){lastGap=gap;started=true;}gap=0;t=addD(t,-1);}
  else{gap++;if(gap>2)break;t=addD(t,-1);}}
 return {n:n,gap:started?lastGap:gap};}
function streak(){return streakInfo().n;}
function streakBar(){
 const si=streakInfo(),st=si.n,fz=frzWeek(TKEY),can=fz<2&&!FRZ.has(TKEY)&&isLect(TKEY);
 const hoy=STUD.has(TKEY)||FRZ.has(TKEY),marg=2-si.gap;
 let m;
 if(hoy)m='Hoy ya cuenta. Margen completo: 2 días.';
 else if(si.gap===0)m='Te quedan 2 días de margen sin perderla.';
 else if(marg>0)m=si.gap+' día'+(si.gap>1?'s':'')+' sin marcar · te queda '+marg+' día'+(marg>1?'s':'')+' de margen';
 else m='Último día: si hoy no marcas nada, la racha vuelve a 0.';
 return `<div class="urg4"><div class="fire"><b>\u{1F525} ${st}</b><span>días de racha</span></div>
  <div class="frz"><span class="${marg<=0&&!hoy?'rojo':''}">${m}</span><span>Congeladores: ${2-fz} de 2</span>
  ${can?`<button class="fz" id="frzbtn">Congelar hoy</button>`:''}</div></div>`;}

async function load9(){try{if(window.storage){const r=await window.storage.get(K9,false);if(r&&r.value){LIVE=JSON.parse(r.value);return;}}}catch(e){}
 try{const v=localStorage.getItem(K9);if(v)LIVE=JSON.parse(v);}catch(e){}}

 let h=`<div class="head"><h1>Clases en directo</h1><p>Apunta cada directo al que asistas: de qué asignatura, cuándo y qué se tocó. Queda guardado y registrado en la caja negra.</p></div>

  <select id="lvc" class="lv-i">${SUBJECTS.map(s=>`<option value="${s.c}">${esc(s.n)}</option>`).join('')}</select>
  <label class="lv-l">Fecha</label><input type="date" id="lvd" class="lv-i" value="${TKEY}">
  <label class="lv-l">Temas que se tocaron</label>

  <div class="btns"><button id="lvadd">Guardar clase</button></div></div>`;
 if(!ord.length)return h+`<div class="blk"><p class="empty">Todavía no has registrado ningún directo.</p></div>`;

 h+=`<div class="head" style="margin-top:26px"><h1 style="font-size:19px">Registradas · ${ord.length}</h1></div>`;
 SUBJECTS.forEach(s=>{const l=by[s.c];if(!l)return;
  h+=`<div class="sb dia"><div class="sb-h"><div><span class="sb-slot">${l.length} clase${l.length>1?'s':''}</span><h2>${esc(s.n)}</h2></div></div>

    <div class="lvc-t">${esc(x.t)}</div>${x.nt?`<div class="lvc-n">${esc(x.nt)}</div>`:''}</div>`).join('')}</div>`;});
 return h;}

/* ===== v10: semilla de historial y reconstruccion ===== */
const SEED=[];
function mergeSeed(){
 const have=new Set(LOG);let add=0;
 SEED.forEach(l=>{if(!have.has(l)){LOG.push(l);have.add(l);add++;}});
 LOG.sort((a,b)=>a.localeCompare(b));
 const IX={};ITEMS.forEach(i=>{IX[BY[i.c].ab+'|'+i.u+'|'+i.txt]=i.id;});
 let rd=0,rn=0;
 LOG.forEach(l=>{
  let m=l.match(/\u2713 (.+?) U(\d+) \u2014 (.+)$/);
  if(m){const id=IX[m[1]+'|'+m[2]+'|'+m[3]];if(id&&!DONE.has(id)){DONE.add(id);rd++;}return;}
  m=l.match(/\u{1F4DD} Apuntes (.+?) U(\d+)$/u);
  if(m){const s=SUBJECTS.find(x=>x.ab===m[1]);if(s){const k=s.c+'|'+m[2];if(!NOTES.has(k)){NOTES.add(k);rn++;}}}});
 if(!Object.keys(AEV).length){
  LOG.forEach(l=>{const m=l.match(/\u{1F4CA} Autoevaluaci\u00f3n (.+?) U(\d+) \u2014 intento (\d+)(?: \u00b7 nota (.+?))?(?:\s* \u00b7 (.))?\s*$/u);
   if(!m)return;const s=SUBJECTS.find(x=>x.ab===m[1]);if(!s)return;
   const k=s.c+'|'+m[2];AEV[k]=AEV[k]||[];
   const n=+m[3],nt=m[4]?m[4].trim():'',df=m[5]?(Object.keys(DIF).find(x=>DIF[x]===m[5])||''):'';
   while(AEV[k].length<n-1)AEV[k].push({d:l.slice(0,16),n:'',f:''});
   if(AEV[k].length>=n){if(nt)AEV[k][n-1].n=nt;if(df)AEV[k][n-1].f=df;return;}
   AEV[k].push({d:l.slice(0,16),n:nt,f:df});});}
 return {add:add,rd:rd,rn:rn};}
const l4b=load4;
load4=async function(){await l4b();const r=mergeSeed();rebuildStud();
 if(r.add||r.rd)LOG.push(stamp()+'  \u{1F527} Historial importado: '+r.add+' línea(s), '+r.rd+' tarea(s) y '+r.rn+' apunte(s) restaurados');
 LOG.sort((a,b)=>a.localeCompare(b));await save4();await save();};
